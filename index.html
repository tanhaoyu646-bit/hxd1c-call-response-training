<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071722">
  <title>HXD1C两站一区间确认呼唤（应答）训练</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 70% 10%,#164768 0,#071722 45%,#030a10 100%);color:#edf9ff;font-family:"Microsoft YaHei",sans-serif}.card{width:min(860px,100%);padding:clamp(28px,6vw,64px);border:1px solid #387da1;border-radius:18px;background:#061927e8;box-shadow:0 28px 80px #0009}.tag{display:inline-block;padding:6px 11px;border:1px solid #58b9df;border-radius:999px;color:#8edfff;font-size:13px}.card h1{margin:20px 0 12px;font-size:clamp(28px,5vw,50px);line-height:1.2}.lead{max-width:700px;color:#b6d1df;font-size:17px;line-height:1.8}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:28px 0}.mode{padding:18px;border:1px solid #285f7e;border-radius:12px;background:#09273b}.mode b{display:block;margin-bottom:7px;color:#fff1a2}.mode span{color:#a9c9d9;font-size:14px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:12px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid #6ee4ff;border-radius:9px;background:#0e6e9c;color:white;text-decoration:none;font-weight:700}.button.secondary{background:#123148;border-color:#417d99}.note{margin:24px 0 0;color:#7fa4b7;font-size:13px}@media(max-width:620px){.modes{grid-template-columns:1fr}.actions .button{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">独立训练项目</span>
    <h1>HXD1C两站一区间<br>确认呼唤（应答）训练</h1>
    <p class="lead">沿用“瞭望技巧”的驾驶台和两站一区间线路，但项目文件、训练状态和评分逻辑完全独立。全程覆盖出站、途中操纵、过分相、通过及进站等18个呼唤点，总分100分。</p>
    <section class="modes">
      <div class="mode"><b>教学模式</b><span>到达呼唤点自动切回正面驾驶台并冻结画面，直接在操作台中央完成选择；答题后播放完整呼唤应答语音。</span></div>
      <div class="mode"><b>考评模式</b><span>列车持续运行，学生须主动点击对应信号机、过分相线路标志或驾驶台设备，再在中央缩小面板完成选择；错答、漏答不得分。</span></div>
    </section>
    <div class="actions">
      <a class="button" href="./call-response-training/?mode=teaching">进入教学模式</a>
      <a class="button secondary" href="./call-response-training/?mode=assessment">进入考评模式</a>
    </div>
    <p class="note">本项目用于虚拟教学训练，不作为实际铁路行车依据。最终标准用语应以项目验收采用的现行《铁路机车操作规则》版本为准。</p>
  </main>
</body>
</html>
